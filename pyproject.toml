[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hearwrite"
version = "0.1.0.dev0"
description = "Real-time transcription, speaker labels and endpointing from open-weight models."
readme = "README.md"
# PEP 639. The matching "License :: OSI Approved" classifier is deliberately
# absent: newer packaging tools reject declaring the licence twice.
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
# 3.11.4, not 3.11.0. tarfile.extractall(filter=...) was a security backport
# that landed in 3.11.4, and model archives are extracted with it. The
# alternative to requiring it is extracting downloaded tarballs without path
# traversal protection, which is not an alternative.
requires-python = ">=3.11.4"
authors = [{ name = "wbnns" }]
keywords = ["asr", "streaming", "diarization", "endpointing", "speech"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
# The base install has NO model runtime, on purpose. `pip install hearwrite`
# gets the event model, the Coordinator, the fakes and the CLI, and the Tier 1
# suite passes in seconds with no GPU, no downloads and no licences to accept.
dependencies = []

[project.optional-dependencies]
# The blessed default: everything ONNX, everything CPU, nothing gated.
onnx = ["sherpa-onnx>=1.13"]
# Semantic endpointing: an 8MB ONNX model plus the numpy to build its features.
turn = ["onnxruntime>=1.20", "numpy>=1.24"]
# A second engine of a genuinely different shape, to prove the interface holds.
whisper = ["faster-whisper>=1.2"]
# The only extra that needs torch. Keep it isolated.
sortformer = ["nemo-toolkit[asr]>=3.0", "torch>=2.4"]
server = ["websockets>=13.0"]
# numpy is here so the log mel tests RUN in CI. They are the most safety
# critical numeric code in the project -- a feature extractor that is quietly
# wrong degrades accuracy invisibly -- and without numpy they skip silently.
# numpy and websockets are here so their tests RUN in CI rather than skipping.
# numpy: the log mel tests are the most safety critical numeric code in the
# project, and a feature extractor that is quietly wrong degrades accuracy
# invisibly. websockets: the UI route tests caught three bugs that each returned
# a plausible looking HTTP response while being wrong.
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11", "numpy>=1.24", "websockets>=13.0"]
all = ["hearwrite[onnx,turn,whisper,server]"]

[project.scripts]
hearwrite = "hearwrite.cli:main"

[project.urls]
Homepage = "https://github.com/wbnns/hearwrite"
Source = "https://github.com/wbnns/hearwrite"

[tool.hatch.build.targets.wheel]
packages = ["src/hearwrite"]
# The browser UI ships inside the package so `hearwrite serve` needs nothing else.
artifacts = ["src/hearwrite/server/ui.html"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
files = ["src/hearwrite"]
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# Neither ships type stubs. Both are used only inside a wrapper whose own
# interface is fully typed, so the untyped surface stops at the module boundary.
module = ["sherpa_onnx.*", "websockets.*", "faster_whisper.*", "onnxruntime.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# numpy's own stubs use syntax newer than our declared floor, and numpy is only
# touched to hand an array to faster-whisper. Checking it buys nothing.
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "tier2: needs real models and downloads; not run by bin/check",
  "network: reaches the internet; needs no weights on disk",
]
# Tier 2 needs real weights on disk, so a bare `pytest` must not reach for it.
addopts = "-q --strict-markers -m 'not tier2 and not network'"
