# CI -- the GitHub-native "definition of done". Each job shells out to the same
# bin/check that runs locally, so a green `bin/check` on your machine predicts a
# green pipeline here.
#
# Note what is NOT here: no GPU runner, no model cache, no Hugging Face token.
# Tier 1 is deliberately free of all three, and keeping this workflow boring is
# how that property stays true. Tier 2 needs real weights and runs separately.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Check (ruff, mypy, tier 1)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor and the ceiling. Anything in between is covered by proxy.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Check
        run: PYTHON=python bin/check

  install:
    name: Bare install has no model dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      # The whole macOS-first, nothing-gated story rests on the base install
      # pulling no runtime. One convenient dependency that drags in torch would
      # break it quietly, so assert it rather than trust it.
      - run: pip install .
      - name: Assert no heavy runtime was installed
        run: |
          set -eu
          for pkg in torch nemo-toolkit onnxruntime sherpa-onnx nvidia-cublas-cu12; do
            if pip show "$pkg" >/dev/null 2>&1; then
              echo "::error::bare install pulled in $pkg; the base install must stay dependency-free"
              exit 1
            fi
          done
          python -c "import hearwrite; print('bare install ok:', hearwrite.__version__)"
          python -m hearwrite.cli demo --policy dictation >/dev/null
          echo "demo runs with zero dependencies"
