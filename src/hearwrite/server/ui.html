<!doctype html>
<meta charset="utf-8">
<title>HearWrite</title>
<style>
  :root {
    --bg:#0b0b0d; --card:#141417; --edge:#26262b; --fg:#f2f2f0; --dim:#77777f;
    --accent:#3d7dff; --hl:#c9dcff; --hlbg:#1e3a6d;
    --a:#3d7dff; --b:#3fb27f; --c:#e0913f; --d:#b478e0;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f7f7f5; --card:#fff; --edge:#e2e2dd; --fg:#16161a; --dim:#82827c;
            --hl:#16161a; --hlbg:#cfe0ff; }
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--fg);
         font:16px/1.6 ui-sans-serif,-apple-system,"SF Pro Text",system-ui,sans-serif;
         display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:14px; padding:16px 22px; }
  h1 { font-size:14px; font-weight:640; margin:0; letter-spacing:.01em; }
  #mic { font:inherit; font-size:14px; font-weight:560; padding:8px 18px;
         border-radius:999px; border:1px solid var(--edge); background:var(--fg);
         color:var(--bg); cursor:pointer; }
  #mic[data-on="1"] { background:#c0392b; border-color:#c0392b; color:#fff; }
  #state { color:var(--dim); font-size:13px; }
  #err { color:#e2725b; font-size:13px; }

  main { flex:1; display:flex; align-items:center; justify-content:center; padding:0 22px 26px; }
  .card { width:min(1000px,100%); background:var(--card); border:1px solid var(--edge);
          border-radius:20px; padding:34px 38px 26px; display:flex; flex-direction:column;
          min-height:min(60vh,460px); }

  .stage { flex:1; display:flex; align-items:center; gap:26px; }
  .who { flex:0 0 96px; text-align:right; color:var(--dim); font-size:14px; padding-top:6px; }
  .who[data-s="A"]{color:var(--a)} .who[data-s="B"]{color:var(--b)}
  .who[data-s="C"]{color:var(--c)} .who[data-s="D"]{color:var(--d)}
  .said { flex:1; font-size:clamp(20px,2.4vw,30px); line-height:1.5; letter-spacing:-0.01em;
          max-height:46vh; overflow-y:auto; }
  .said::-webkit-scrollbar { width:0; }
  .partial { color:var(--dim); }
  .unlabelled { border-bottom:1px dotted var(--dim); }
  /* The most recent word, the way a caption highlights what is being said. */
  .live { background:var(--hlbg); color:var(--hl); border-radius:4px; padding:1px 3px; }
  .brk { display:block; height:0; margin-bottom:10px; }
  .polished { animation:settle 700ms ease-out; }
  @keyframes settle { from { background:var(--hlbg); } to { background:transparent; } }
  .idle { color:var(--dim); font-size:17px; }

  .wave { display:flex; align-items:center; gap:16px; margin-top:22px;
          padding-top:18px; border-top:1px solid var(--edge); }
  #bars { flex:1; height:46px; display:block; }
  .stat { display:flex; gap:20px; color:var(--dim);
          font:12px ui-monospace,SFMono-Regular,Menlo,monospace; }
  .stat b { color:var(--fg); font-weight:600; }
</style>

<header>
  <h1>HearWrite</h1>
  <button id="mic" data-on="0">Start listening</button>
  <span id="state">not connected</span>
  <span id="err"></span>
</header>

<main>
  <div class="card">
    <div class="stage">
      <div class="who" id="who"></div>
      <div class="said" id="said"><span class="idle">Press start and speak. Words appear as
        they are recognised, the speaker label fills in once there is enough voice to
        identify, and a line break marks where a sentence ended.</span></div>
    </div>
    <div class="wave">
      <canvas id="bars"></canvas>
      <div class="stat">
        <span>delay p50 <b id="p50">—</b></span>
        <span>p90 <b id="p90">—</b></span>
        <span>words <b id="words">0</b></span>
        <span>speakers <b id="spk">0</b></span>
      </div>
    </div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const said = $("said"), whoEl = $("who");
let ws, ctx, node, stream, running = false, started = false;
const delays = [], speakers = new Set();
let lastTurn = 1, turnSpeaker = null;

function setState(t) { $("state").textContent = t; }

function beginTranscript() {
  if (started) return;
  started = true;
  said.innerHTML = "";
}

function setSpeaker(who) {
  turnSpeaker = who;
  whoEl.textContent = who ? "Speaker " + who : "";
  whoEl.dataset.s = who || "";
}

function clearPartials() { said.querySelectorAll(".partial").forEach(n => n.remove()); }
function clearLive() { said.querySelectorAll(".live").forEach(n => n.classList.remove("live")); }

function scrollDown() { said.scrollTop = said.scrollHeight; }

function render(ev) {
  const p = ev.payload || {};

  if (ev.kind === "turn_start") {
    beginTranscript();
    lastTurn = p.turn;
    setSpeaker(p.speaker);
    clearPartials();
    return;
  }

  if (ev.kind === "commit") {
    beginTranscript();
    clearPartials();
    clearLive();
    lastTurn = p.turn || lastTurn;
    const w = document.createElement("span");
    w.textContent = p.text + " ";
    w.dataset.seq = ev.seq;
    w.className = "live" + (p.speaker ? "" : " unlabelled");
    said.appendChild(w);
    delays.push(p.delay);
    $("words").textContent = delays.length;
    const s = [...delays].sort((a, b) => a - b);
    $("p50").textContent = s[Math.floor(s.length * 0.5)].toFixed(2) + "s";
    $("p90").textContent = s[Math.floor(s.length * 0.9)].toFixed(2) + "s";
    if (p.speaker) {
      speakers.add(p.speaker);
      $("spk").textContent = speakers.size;
      if (!turnSpeaker) setSpeaker(p.speaker);
    }
    scrollDown();
    return;
  }

  if (ev.kind === "partial") {
    beginTranscript();
    clearPartials();
    const w = document.createElement("span");
    w.className = "partial";
    w.textContent = p.text + " ";
    said.appendChild(w);
    scrollDown();
    return;
  }

  if (ev.kind === "speaker") {
    speakers.add(p.speaker);
    $("spk").textContent = speakers.size;
    if (p.seq === undefined) {
      if (p.turn === lastTurn) setSpeaker(p.speaker);
    } else {
      const w = said.querySelector('[data-seq="' + p.seq + '"]');
      if (w) w.classList.remove("unlabelled");
      if (!turnSpeaker) setSpeaker(p.speaker);
    }
    return;
  }

  if (ev.kind === "endpoint") {
    clearPartials();
    const last = said.lastElementChild;
    if (last && !last.classList.contains("brk")) {
      const mark = document.createElement("span");
      mark.className = "brk";
      said.appendChild(mark);
      scrollDown();
    }
    return;
  }

  if (ev.kind === "polished") {
    const first = said.querySelector('[data-seq="' + p.from_seq + '"]');
    if (!first) return;
    let unlabelled = false, node = first;
    const doomed = [];
    while (node) {
      const seq = Number(node.dataset.seq);
      if (!Number.isFinite(seq) || seq > p.to_seq) break;
      if (node.classList.contains("unlabelled")) unlabelled = true;
      if (node !== first) doomed.push(node);
      node = node.nextElementSibling;
    }
    doomed.forEach(n => n.remove());
    first.textContent = p.text + " ";
    first.className = "polished" + (unlabelled ? " unlabelled" : "");
    return;
  }

  if (ev.kind === "degraded") {
    $("err").textContent = p.degraded ? "falling behind: partials dropped" : "";
  }
}

// -- the waveform ----------------------------------------------------------
// A rolling picture of what the microphone is hearing, so silence looks like
// silence. It is drawn from the same samples that go to the recogniser rather
// than a second analyser, so what you see is what it is transcribing.
const LEVELS = [];
const MAX_BARS = 220;
function pushLevel(pcm) {
  let peak = 0;
  for (let i = 0; i < pcm.length; i += 8) {
    const v = Math.abs(pcm[i]);
    if (v > peak) peak = v;
  }
  LEVELS.push(peak / 32768);
  while (LEVELS.length > MAX_BARS) LEVELS.shift();
}

function drawWave() {
  const c = $("bars"), dpr = devicePixelRatio || 1;
  const w = c.clientWidth, h = c.clientHeight;
  if (c.width !== w * dpr) { c.width = w * dpr; c.height = h * dpr; }
  const g = c.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);
  const style = getComputedStyle(document.documentElement);
  const accent = style.getPropertyValue("--accent").trim();
  const dim = style.getPropertyValue("--dim").trim();
  const gap = 3, bw = 2;
  const n = Math.min(LEVELS.length, Math.floor(w / (bw + gap)));
  for (let i = 0; i < n; i++) {
    const level = LEVELS[LEVELS.length - n + i];
    const bh = Math.max(2, Math.min(h, level * h * 2.6));
    // The newest few bars are the accent colour: that is "now".
    g.fillStyle = i > n - 6 ? accent : dim;
    g.globalAlpha = i > n - 6 ? 1 : 0.55;
    g.fillRect(i * (bw + gap), (h - bh) / 2, bw, bh);
  }
  requestAnimationFrame(drawWave);
}
requestAnimationFrame(drawWave);

// -- capture ---------------------------------------------------------------
async function start() {
  $("err").textContent = "";
  setState("asking for the microphone…");
  stream = await navigator.mediaDevices.getUserMedia({
    audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true },
  });

  // Ask the browser for 16kHz directly. Every model in the pipeline expects it,
  // and resampling in JavaScript is a good way to be quietly wrong.
  ctx = new AudioContext({ sampleRate: 16000 });
  if (ctx.sampleRate !== 16000) {
    throw new Error("browser gave " + ctx.sampleRate + "Hz, need 16000Hz");
  }

  const url = (location.protocol === "https:" ? "wss://" : "ws://") + location.host;
  ws = new WebSocket(url);
  ws.binaryType = "arraybuffer";
  await new Promise((ok, no) => {
    ws.onopen = ok;
    ws.onerror = () => no(new Error("cannot reach " + url));
  });
  setState("listening");

  ws.onmessage = (m) => {
    const d = JSON.parse(m.data);
    if (d.kind === "hello") { setState("listening · protocol " + d.protocol); return; }
    render(d);
  };
  ws.onclose = () => { if (running) { setState("disconnected"); stop(); } };

  await ctx.audioWorklet.addModule(
    URL.createObjectURL(new Blob([`
      class Tap extends AudioWorkletProcessor {
        process(inputs) {
          const ch = inputs[0][0];
          if (ch) {
            const pcm = new Int16Array(ch.length);
            for (let i = 0; i < ch.length; i++) {
              const s = Math.max(-1, Math.min(1, ch[i]));
              pcm[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
            }
            this.port.postMessage(pcm.buffer, [pcm.buffer]);
          }
          return true;
        }
      }
      registerProcessor("tap", Tap);
    `], { type: "application/javascript" }))
  );

  node = new AudioWorkletNode(ctx, "tap");
  node.port.onmessage = (e) => {
    const pcm = new Int16Array(e.data);
    pushLevel(pcm);
    if (ws.readyState === 1) ws.send(pcm.buffer);
  };
  ctx.createMediaStreamSource(stream).connect(node);
  node.connect(ctx.createGain()).connect(ctx.destination);
}

function stop() {
  running = false;
  $("mic").dataset.on = "0";
  $("mic").textContent = "Start listening";
  clearLive();
  try { if (ws && ws.readyState === 1) ws.send("finish"); } catch (e) {}
  try { node && node.disconnect(); } catch (e) {}
  try { ctx && ctx.close(); } catch (e) {}
  try { stream && stream.getTracks().forEach(t => t.stop()); } catch (e) {}
  setState("stopped");
}

if (new URLSearchParams(location.search).has("autostart")) {
  addEventListener("load", () => $("mic").click());
}

$("mic").onclick = async () => {
  if (running) return stop();
  running = true;
  $("mic").dataset.on = "1";
  $("mic").textContent = "Stop";
  try {
    await start();
  } catch (e) {
    $("err").textContent = e.message;
    setState("failed");
    stop();
  }
};
</script>
